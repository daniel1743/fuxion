	<body>
		<div id="root">
			<!-- Splash visible inmediatamente mientras React carga -->
			<div id="initial-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(16,185,129,0.08),transparent 40%),radial-gradient(circle at 80% 80%,rgba(52,211,153,0.05),transparent 30%),linear-gradient(165deg,#f0fdf4 0%,#ffffff 45%,#fafdf6 100%);opacity:1;transition:opacity 450ms ease">
				<div style="position:absolute;width:min(75vw,400px);aspect-ratio:1;border-radius:9999px;background:radial-gradient(circle,rgba(16,185,129,0.15),transparent 70%);filter:blur(32px)"></div>
				<div style="position:relative;display:flex;width:min(40vw,164px);aspect-ratio:1;align-items:center;justify-content:center;border:1.5px solid rgba(16,185,129,0.2);border-radius:38%;background:linear-gradient(150deg,#ffffff 0%,#f0fdf4 50%,#ecfdf5 100%);box-shadow:0 24px 60px rgba(4,120,87,0.15),0 8px 20px rgba(4,120,87,0.08),inset 0 1px 0 rgba(255,255,255,0.95)">
					<!-- FuXion X Green Logo SVG inline -->
					<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:68%;height:68%;position:relative;z-index:2;display:block">
						<defs>
							<linearGradient id="xGradInit" x1="0" y1="0" x2="1" y2="1">
								<stop offset="0%" stopColor="#059669"/>
								<stop offset="50%" stopColor="#10B981"/>
								<stop offset="100%" stopColor="#34D399"/>
							</linearGradient>
							<linearGradient id="leafGradInit" x1="0" y1="1" x2="1" y2="0">
								<stop offset="0%" stopColor="#047857"/>
								<stop offset="100%" stopColor="#6EE7B7"/>
							</linearGradient>
							<filter id="logoShadowInit">
								<feDropShadow dx="0" dy="4" stdDeviation="8" floodColor="#059669" floodOpacity="0.25"/>
							</filter>
						</defs>
						<g filter="url(#logoShadowInit)">
							<path d="M160 140 C200 180, 240 230, 256 256 C272 230, 312 180, 352 140" stroke="url(#xGradInit)" strokeWidth="38" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
							<path d="M352 140 C312 190, 280 240, 256 256 C232 240, 200 190, 160 140" stroke="url(#xGradInit)" strokeWidth="38" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
							<path d="M160 372 C200 332, 240 282, 256 256 C272 282, 312 332, 352 372" stroke="url(#xGradInit)" strokeWidth="38" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
							<path d="M352 372 C312 322, 280 272, 256 256 C232 272, 200 322, 160 372" stroke="url(#xGradInit)" strokeWidth="38" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
						</g>
						<g style="transform-origin:center bottom">
							<path d="M256 140 C256 140, 220 110, 200 90 C180 70, 190 50, 210 55 C230 60, 256 90, 256 90" fill="url(#leafGradInit)" opacity="0.9"/>
							<path d="M256 140 C256 140, 292 110, 312 90 C332 70, 322 50, 302 55 C282 60, 256 90, 256 90" fill="url(#leafGradInit)" opacity="0.7"/>
							<line x1="256" y1="140" x2="256" y2="70" stroke="#047857" strokeWidth="2" strokeLinecap="round" opacity="0.4"/>
						</g>
					</svg>

				<p style="position:relative;margin-top:24px;color:#064e3b;font-size:clamp(1.5rem,6.5vw,2.1rem);font-weight:800;letter-spacing:-0.04em;line-height:1.15;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center">Nutrición <span style="font-weight:400;color:#047857;letter-spacing:-0.02em">de verdad</span></p>

				@keyframes splash-progress{from{transform:translateX(-100%)}to{transform:translateX(0)}}
